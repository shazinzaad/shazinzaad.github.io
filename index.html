function render(){if(!tabs[role].some(t=>t[0]===page))page=tabs[role][0][0];$('#app').innerHTML=`<div class="top"><span>Interactive team demo · Fictional outlets · No real payments</span><button data-action="reset">Reset demo</button></div><div class="shell"><aside><div><div class="logo">za’ad<span>.</span></div><div class="brand-note">DUBAI · DAILY BOXES</div></div><nav class="roles" aria-label="Demo role">${[['customer','Customer'],['partner','Restaurant / café'],['ops','Za’ad operations']].map(([r,n],i)=>`<button class="${role===r?'active':''}" data-action="role:${r}" aria-pressed="${role===r}"><span class="role-n">0${i+1}</span>${n}</button>`).join('')}</nav><div class="side-note"><strong>One process. Three perspectives.</strong><p>Switch roles to see how the same order moves through Za’ad.</p>${btn('Start walkthrough','tour:start','secondary small')}<p><small>Demo data stays in this browser. Each device has its own session.</small></p></div></aside><main class="content"><header class="toolbar"><nav class="subnav" aria-label="${role} sections">${tabs[role].map(([p,n])=>`<button class="${page===p?'active':''}" data-action="page:${p}" aria-current="${page===p?'page':'false'}">${n}</button>`).join('')}</nav><span class="badge">Dubai · Pilot studio</span></header>${tourHTML()}${role==='customer'?customerHTML():role==='partner'?partnerHTML():opsHTML()}<footer class="muted" style="font-size:12px;margin-top:32px">Za’ad Pilot Studio · Sample data only · ${btn('Pilot plan','plan','secondary small')} ${btn('Walkthrough','tour:start','secondary small')}</footer></main></div>`}
function tourHTML(){if(state.tour<0)return '';let t=tours[state.tour];return `<section class="tour"><div class="row"><strong>Walkthrough ${state.tour+1} / ${tours.length} — ${t[0]}</strong><button class="back" data-action="tour:close">Close</button></div><p>${t[1]}</p><div class="row">${btn('Open this view',`goto:${t[2]}:${t[3]}`,'small')}${btn(state.tour===5?'Finish walkthrough':'Next step','tour:next','secondary small')}</div></section>`}
function customerHTML(){if(page==='orders')return `<h1>Your daily discoveries.</h1><p class="muted">Your reservations, collection details and updates in one place.</p><div class="panel">${state.orders.length?state.orders.slice().reverse().map(orderHTML).join(''):`<div class="empty"><h2>Your first box is waiting.</h2><p class="muted">Explore today’s offers and make a demo reservation.</p>${btn('Explore daily boxes','page:discover')}</div>`}</div>`;if(detail)return detailHTML();let offers=state.offers.filter(o=>o.published&&partner(o.partner).status==='Approved'&&(filter==='All'||o.category===filter)&&`${partner(o.partner).name} ${o.title} ${partner(o.partner).area}`.toLowerCase().includes(search.toLowerCase()));return `<section class="hero"><div><h1>Your neighbourhood,<br><em>by the box.</em></h1><p>Discover a bakery, kitchen or café near you. Choose a daily box and pick it up this evening.</p>${btn('Explore the boxes ↓','browse')}</div><div class="hero-photo" role="img" aria-label="Golden croissants on a bakery counter"></div></section><div class="journey" aria-label="Order journey"><b>01 · Choose a box</b><i>→</i><b>02 · Reserve</b><i>→</i><b>03 · Collect</b></div><div class="row wrap"><h2 style="margin:0">Discover today’s boxes</h2><span class="muted">Sample offers · Dubai</span></div><label style="display:block;margin-top:18px"><span class="muted">Find an outlet or neighbourhood</span><input id="search" placeholder="Try Jumeirah or Palm & Crumb" value="${esc(search)}"></label><div class="filters">${['All','Bakery','Meals','Desserts','Groceries'].map(c=>`<button class="chip ${filter===c?'active':''}" data-action="filter:${c}">${c}</button>`).join('')}</div><div class="grid">${offers.map(o=>`<article class="offer"><div class="offer-cover" data-food="${esc(o.category)}"><span class="cover-title">${esc(o.category)}</span><span class="roundmark" aria-hidden="true">${esc(partner(o.partner).name[0])}</span></div><div class="offer-body"><div class="row"><small>${esc(partner(o.partner).area)}</small><span class="badge">${Math.round((1-o.price/o.value)*100)}% off</span></div><h3 style="margin-top:12px">${esc(partner(o.partner).name)}</h3><p>${esc(o.title)} · ${remaining(o)} available</p><p class="muted">Pickup ${esc(o.time)}</p><div class="row"><strong class="price">AED ${o.price}</strong><small>Regular value AED ${o.value}</small></div>${btn(remaining(o)>0?'View daily box':'Sold out',`detail:${o.id}`,'',remaining(o)<=0)}</div></article>`).join('')||'<div class="panel"><h3>No boxes in this selection.</h3><p>Try another category or search.</p></div>'}</div>`}
function detailHTML(){let o=offer(detail),p=partner(o.partner);return `<button class="back" data-action="back">← Back to discover</button><h1>${esc(o.title)}</h1><p class="muted">${esc(p.name)} · ${esc(p.area)}, Dubai</p><div class="split"><section class="panel"><h2>A little surprise, clearly explained.</h2><p>${esc(o.desc)}</p><div class="divider"></div><h3>What to expect</h3><p>Contents vary with the outlet’s daily selection. Regular retail value is at least ${money(o.value)}.</p><h3>Ingredients & allergens</h3><p>${esc(o.allergens)} Contact the outlet before reserving if you have a dietary requirement. A surprise box may not be suitable for severe allergies.</p><h3>Collect from the outlet</h3><p>${esc(p.name)}, ${esc(p.area)} · Sample location<br>Today, ${esc(o.time)}. Show your collection code at the counter.</p></section><section class="panel"><h2>Your reservation</h2><div class="row"><strong class="price">${money(o.price)}</strong><span class="badge">${remaining(o)} left</span></div><p class="muted">One box · Pickup included · No delivery</p><div class="notice">Demo checkout: no card details, money or real booking. Prices and commercial terms are illustrative.</div><form id="reserve" class="form"><label class="checklabel"><input type="checkbox" required name="ack">I have reviewed the pickup window and ingredient information. I understand the contents vary.</label>${btn('Place demo reservation','submit','',remaining(o)<=0||!o.published)}</form><p><small>Cancel before preparation begins. If the outlet cannot fulfil the order, contact operations for a demo refund.</small></p></section></div>`}
function orderHTML(x){let o=offer(x.offer),p=partner(o.partner),progress=['Reserved','Preparing','Ready','Collected'].indexOf(x.status);return `<article class="order"><div class="row wrap"><h3>${esc(p.name)} · ${esc(o.title)}</h3>${badge(x.status)}</div><p class="muted">${esc(x.id)} · ${money(x.amount)} · Pickup ${esc(o.time)}</p><div class="steps" aria-label="Order status: ${esc(x.status)}">${[0,1,2,3].map(i=>`<span class="${i<=progress?'done':''}"></span>`).join('')}</div>${['Reserved','Preparing','Ready'].includes(x.status)?`<div class="ticket"><small>Show this code at ${esc(p.name)}</small><strong class="code">${x.code}</strong><small>Staff verifies this code at handover. Your code is used only once.</small></div>`:''}<div class="row wrap" style="margin-top:15px"><small>Payment: ${x.status==='Refunded'?'Refund simulated':x.status==='Cancelled'?'Reversal simulated':'Demo payment recorded'}${x.settled?' · Merchant settlement simulated':''}</small>${x.status==='Reserved'?btn('Cancel reservation',`cancel:${x.id}`,'danger small'):''}</div></article>`}
function partnerHTML(){let p=partner(selected),mine=state.offers.filter(o=>o.partner===selected),orders=state.orders.filter(x=>offer(x.offer).partner===selected);let head=`<div class="row wrap" style="margin-bottom:24px"><div><h1>Partner workspace</h1><p class="muted" style="margin-bottom:0">Publish a box. Prepare with care. Make someone’s day.</p></div><label>Viewing outlet<select id="outlet">${state.partners.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label></div>${p.status!=='Approved'?'<div class="notice warm">This outlet is awaiting operations approval. Publishing is disabled until approved.</div>':''}`;
if(page==='listings')return head+`<div class="split"><section class="panel"><h2>Your daily boxes</h2>${mine.map(o=>`<article class="order"><div class="row"><h3>${esc(o.title)}</h3>${badge(o.published?'Published':'Draft')}</div><p>${money(o.price)} · Value ${money(o.value)}<br>${remaining(o)} of ${o.quantity} available · ${esc(o.time)}</p>${btn(o.published?'Pause listing':'Publish box',`publish:${o.id}`,'secondary small',p.status!=='Approved')}</article>`).join('')||'<p>No daily boxes yet. Create your first offer.</p>'}</section><section class="panel"><h2>Create a daily box</h2><form id="listing" class="form"><label>Box name<input name="title" required maxlength="60" placeholder="The evening bakery box"></label><label>Category<select name="category">${['Bakery','Meals','Desserts','Groceries'].map(c=>`<option>${c}</option>`).join('')}</select></label><div class="twocol"><label>Box price (AED)<input name="price" type="number" min="1" max="500" step=".5" value="20" required></label><label>Regular value (AED)<input name="value" type="number" min="2" max="1500" step=".5" value="50" required></label></div><label>Available boxes<input name="quantity" type="number" min="1" max="100" step="1" value="5" required></label><div class="twocol"><label>Pickup starts<input name="start" type="time" value="20:00" required></label><label>Pickup ends<input name="end" type="time" value="21:00" required></label></div><label>Portions / what to expect<input name="desc" required maxlength="180" placeholder="A selection of baked treats. Serves 1–2."></label><label>Ingredients & allergen information<input name="allergens" required maxlength="220" placeholder="Provide relevant ingredients and cross-contact guidance"></label><label class="checklabel"><input type="checkbox" required>I confirm the listed items remain safe to sell and meet the outlet’s handling and shelf-life requirements.</label>${btn('Save draft box','submit','',p.status!=='Approved')}</form></section></div>`;
if(page==='orders')return head+`<section class="panel"><h2>Collection board</h2><p class="muted">Prepare the box, mark it ready, then verify the customer’s code at handover.</p>${orders.length?orders.slice().reverse().map(x=>`<article class="order"><div class="row wrap"><h3>${esc(x.id)} · ${esc(offer(x.offer).title)}</h3>${badge(x.status)}</div><p>${money(x.amount)} · Pickup ${esc(offer(x.offer).time)}</p>${x.status==='Reserved'?btn('Start preparation',`status:${x.id}:Preparing`):x.status==='Preparing'?btn('Mark ready for pickup',`status:${x.id}:Ready`):x.status==='Ready'?`<form class="collect form" data-order="${x.id}"><label>Customer collection code<input name="code" inputmode="numeric" pattern="[0-9]{6}" required maxlength="6" placeholder="Enter the 6-digit code"></label>${btn('Verify & complete collection','submit')}</form>`:'<small>No further partner action required.</small>'}</article>`).join(''):'<div class="empty"><h3>No reservations yet.</h3><p>Switch to Customer and reserve one of this outlet’s boxes.</p></div>'}</section>`;
if(page==='payouts')return head+`<section class="panel"><h2>Merchant payout ledger</h2><div class="notice">Illustrative commission: 25%. Demo amounts exclude tax treatment and payment fees. Only collected orders qualify for settlement.</div>${ledger(orders,false)}</section>`;
return head+`<div class="metrics">${metric('Published boxes',mine.filter(o=>o.published).length)}${metric('Open orders',orders.filter(x=>['Reserved','Preparing','Ready'].includes(x.status)).length)}${metric('Collected',orders.filter(x=>x.status==='Collected').length)}${metric('Merchant share',money(orders.filter(x=>x.status==='Collected').reduce((a,x)=>a+x.amount*.75,0)))}</div><div class="split"><section class="panel"><h2>Your next actions</h2><div class="guide"><span class="guide-num">1</span><div><h3>Confirm today’s offer</h3><p>Set a realistic quantity, box value, contents guidance and pickup window.</p>${btn('Manage daily boxes','page:listings','secondary small')}</div></div><div class="guide"><span class="guide-num">2</span><div><h3>Prepare and hand over</h3><p>Follow orders through preparation. Verify the code only when handing over the box.</p>${btn('Open collection board','page:orders','secondary small')}</div></div></section><section class="panel"><h2>Outlet details</h2><h3>${esc(p.name)}</h3><p>${esc(p.area)}, Dubai · Fictional outlet</p>${badge(p.status)}<div class="divider"></div><p>Staff can pause a listing at any time. Existing reservations still need fulfilment or an operations refund.</p></section></div>`}
const metric=(t,v)=>`<div class="metric"><small>${t}</small><strong>${v}</strong></div>`;
function ledger(orders,admin){let items=orders.filter(x=>x.status==='Collected');return items.length?`<div class="table-wrap"><table><thead><tr><th>Order / outlet</th><th>Sale</th><th>Za’ad 25%</th><th>Merchant 75%</th><th>Settlement</th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.id)}<br><small>${esc(partner(offer(x.offer).partner).name)}</small></td><td>${money(x.amount)}</td><td>${money(x.amount*.25)}</td><td>${money(x.amount*.75)}</td><td>${x.settled?badge('Settled'):admin?btn('Simulate payout',`settle:${x.id}`,'small'):badge('Pending')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><h3>No completed collections yet.</h3><p>Complete a collection in the partner workspace to create a settlement entry.</p></div>'}
function opsHTML(){if(page==='playbook')return playbook();let header=`<h1>The whole picture.</h1><p class="muted">Keep partners, orders and collections moving together.</p>`;
if(page==='partners')return header+`<div class="split"><section class="panel"><h2>Partner onboarding</h2>${state.partners.map(p=>`<article class="order"><div class="row wrap"><h3>${esc(p.name)}</h3>${badge(p.status)}</div><p class="muted">${esc(p.area)} · Sample outlet</p>${p.status==='Pending'?`<p>Before a real pilot: verify the licence, food handling process, contact person, agreed pricing and staff training.</p>${btn('Approve demo outlet',`approve:${p.id}`,'small')}`:btn('View partner workspace',`outlet:${p.id}`,'secondary small')}</article>`).join('')}</section><section class="panel"><h2>Add a pilot prospect</h2><p class="muted">Simulate the handoff from your outreach questionnaire. No messages are sent.</p><form id="prospect" class="form"><label>Outlet name<input name="name" required maxlength="60"></label><label>Dubai area<input name="area" required maxlength="60"></label><label>Interested in daily boxes?<select name="interested"><option>Yes</option><option>No</option></select></label><label>Can provide a fixed pickup window?<select name="pickup"><option>Yes</option><option>No</option></select></label>${btn('Add prospect for review','submit')}</form></section></div>`;
if(page==='orders')return header+`<section class="panel"><h2>All orders & exceptions</h2><div class="notice">Refunds and cancellations are simulations. A demo refund reverses the customer payment and removes any unsettled merchant entitlement. Settled orders require reconciliation and cannot be refunded here.</div>${state.orders.length?`<div class="table-wrap"><table><thead><tr><th>Order</th><th>Outlet / box</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.orders.slice().reverse().map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(partner(offer(x.offer).partner).name)}<br><small>${esc(offer(x.offer).title)}</small></td><td>${money(x.amount)}</td><td>${badge(x.status)}</td><td>${!['Refunded','Cancelled'].includes(x.status)&&!x.settled?btn('Refund demo order',`refund:${x.id}`,'danger small'):x.settled?'Settled · reconcile offline':'Closed'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No orders yet. Make a customer reservation to begin.</div>'}</section>`;
if(page==='settlements')return header+`<section class="panel"><h2>Settlement review</h2><p class="muted">Review collected orders, then simulate a merchant payout. No money moves.</p>${ledger(state.orders,true)}</section>`;
return header+`<div class="metrics">${metric('Approved outlets',state.partners.filter(p=>p.status==='Approved').length)}${metric('Reservations',state.orders.length)}${metric('Collected sales',money(state.orders.filter(x=>x.status==='Collected').reduce((a,x)=>a+x.amount,0)))}${metric('Needs preparation',state.orders.filter(x=>x.status==='Reserved').length)}</div><div class="split"><section class="panel"><h2>Today’s operating priorities</h2><div class="guide"><span class="guide-num">1</span><div><h3>Activate the right outlets</h3><p>${state.partners.filter(p=>p.status==='Pending').length} awaiting review. Confirm readiness before publishing.</p>${btn('Review partners','page:partners','secondary small')}</div></div><div class="guide"><span class="guide-num">2</span><div><h3>Resolve order exceptions</h3><p>Watch for unavailable boxes, missed pickup windows and customer complaints.</p>${btn('Review all orders','page:orders','secondary small')}</div></div><div class="guide"><span class="guide-num">3</span><div><h3>Close the loop</h3><p>Reconcile collected orders and merchant payments.</p>${btn('Review settlements','page:settlements','secondary small')}</div></div></section><section class="panel"><h2>Activity trail</h2><ul class="activity">${state.events.slice(0,12).map(e=>`<li>${esc(e.text)}<time>${new Date(e.at).toLocaleTimeString('en-GB',{timeZone:'Asia/Dubai',hour:'2-digit',minute:'2-digit'})} · Dubai time</time></li>`).join('')}</ul></section></div>`}
function playbook(){return `<h1>From first conversation<br>to first collection.</h1><p class="muted">A practical plan for showing the team the process, then preparing a controlled Dubai pilot.</p><div class="notice warm"><strong>What this demo does:</strong> connected role views, browser-local stock and orders, sample payment records, pickup verification and settlement simulations.<br><strong>Before real transactions:</strong> shared backend, real accounts and permissions, licensed operating setup, merchant verification, payment provider, notifications, refund handling and approved commercial terms.</div><div class="split"><section class="panel"><h2>Run a 10-minute team demonstration</h2>${tours.map((t,i)=>`<div class="guide"><span class="guide-num">${i+1}</span><div><h3>${t[0]}</h3><p>${t[1]}</p>${btn('Show this step',`goto:${t[2]}:${t[3]}`,'secondary small')}</div></div>`).join('')}</section><section><div class="panel"><h2>Proposed pilot rollout</h2><h3>Week 1 · Validate</h3><p>Approach 15–20 nearby outlets with your short questionnaire. Discuss quantities, pricing, preparation and collection with interested decision makers.</p><h3>Week 2 · Rehearse</h3><p>Select 3–5 outlets in one area. Agree responsibilities, verify readiness and run staff practice orders without charging customers.</p><h3>Weeks 3–4 · Controlled launch</h3><p>After the required operational and technical setup, invite a small customer group. Cap daily quantities, staff support during pickup, and review issues daily.</p></div><div class="panel"><h2>Who owns what?</h2><p><strong>Partner:</strong> food eligibility, ingredients, packaging, quantity and handover.</p><p><strong>Customer:</strong> review details, reserve, arrive within the window and show the code.</p><p><strong>Za’ad team:</strong> onboard partners, monitor fulfilment, handle support and reconcile payments.</p></div><div class="panel"><h2>Proposed success measures</h2><p>Track daily published boxes, sell-through, completed collections, merchant cancellations, refunds, repeat purchase and contribution per order.</p><p class="muted">Suggested discussion targets: 95% fulfilment, fewer than 5% merchant cancellations, and positive order contribution. These are planning assumptions, not industry benchmarks.</p></div><div class="panel"><h2>Sharing this demo</h2><p>Share the demo link with your team. Each browser has independent sample data; role switching is a simulation, not authentication.</p>${btn('Download session report','export','secondary small')}</div></section></div>`}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b||b.disabled)return;let [a,id,arg]=b.dataset.action.split(':');if(a==='submit')return;if(a==='browse'){document.querySelector('.journey').scrollIntoView({behavior:'smooth'});return;}if(a==='role'){role=id;page=tabs[role][0][0];detail=null}if(a==='page'){page=id;detail=null}if(a==='goto'){role=id;page=arg;detail=null}if(a==='plan'){role='ops';page='playbook';detail=null}if(a==='filter'){filter=id}if(a==='detail')detail=Number(id);if(a==='back')detail=null;if(a==='outlet'){selected=Number(id);role='partner';page='overview'}if(a==='tour'){if(id==='start')state.tour=0;if(id==='close')state.tour=-1;if(id==='next')state.tour=state.tour===5?-1:state.tour+1;save()}if(a==='reset'){if(!confirm('Reset all sample orders, partners and changes in this browser?'))return;state=seed();selected=1;detail=null;save();toast('Demo reset. Ready for a fresh walkthrough.')}if(a==='publish'){let o=offer(Number(id));if(partner(o.partner).status!=='Approved')return;o.published=!o.published;log(`${partner(o.partner).name}: ${o.title} ${o.published?'published':'paused'}.`);toast(o.published?'Daily box published.':'Listing paused. Existing reservations remain active.')}if(a==='approve'){partner(Number(id)).status='Approved';log(`${partner(Number(id)).name} approved for the demo.`);toast('Demo outlet approved.')}if(a==='status'){let x=state.orders.find(x=>x.id===id);if(x&&((x.status==='Reserved'&&arg==='Preparing')||(x.status==='Preparing'&&arg==='Ready'))){x.status=arg;log(`${id} moved to ${arg}.`);toast(`Order ${arg.toLowerCase()}.`)}}if(a==='cancel'){let x=state.orders.find(x=>x.id===id);if(x?.status==='Reserved'){x.status='Cancelled';log(`${id} cancelled; demo payment reversed and box released.`);toast('Reservation cancelled. Demo payment reversed.')}}if(a==='refund'){let x=state.orders.find(x=>x.id===id);if(x&&!x.settled&&!['Cancelled','Refunded'].includes(x.status)&&confirm('Simulate a full refund for this order?')){x.status='Refunded';log(`${id} refunded in full (simulation).`);toast('Demo refund recorded.')}}if(a==='settle'){let x=state.orders.find(x=>x.id===id);if(x?.status==='Collected'&&!x.settled){x.settled=true;log(`${id}: ${money(x.amount*.75)} merchant payout simulated.`);toast('Merchant settlement simulated.')}}if(a==='export'){let data=new Blob([JSON.stringify({note:'Fictional demo session. Not a financial record.',...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(data),link=document.createElement('a');link.href=url;link.download='zaad-demo-session.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}save();render()});
document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;search=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='outlet'){selected=Number(e.target.value);render()}});
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target,d=new FormData(f);if(f.id==='reserve'){let o=offer(detail);if(!o.published||remaining(o)<1||partner(o.partner).status!=='Approved')return toast('This box is unavailable. Please choose another.');let id='ZA-'+String(state.orders.length+1001),code=String(100000+Math.floor(Math.random()*900000));state.orders.push({id,code,offer:o.id,amount:o.price,status:'Reserved',settled:false,consumed:false});log(`${id} reserved at ${partner(o.partner).name}; demo payment recorded.`);detail=null;page='orders';toast('Your demo box is reserved.')}if(f.id==='listing'){let price=Number(d.get('price')),value=Number(d.get('value'));if(price>=value)return toast('Regular value must be higher than the box price.');if(d.get('start')>=d.get('end'))return toast('Pickup end must be after the start on the same day.');if(partner(selected).status!=='Approved')return;state.offers.push({id:Math.max(...state.offers.map(o=>o.id),0)+1,partner:selected,title:d.get('title'),category:d.get('category'),price,value,quantity:Number(d.get('quantity')),time:`${d.get('start')}–${d.get('end')}`,desc:d.get('desc'),allergens:d.get('allergens'),published:false});log(`${partner(selected).name} saved a draft daily box.`);toast('Draft saved. Publish it when ready.')}if(f.id==='prospect'){if(d.get('interested')==='No'||d.get('pickup')==='No'){log(`Prospect ${d.get('name')}: follow-up needed before onboarding.`);toast('Follow-up recorded in the activity trail.')}else{state.partners.push({id:Math.max(...state.partners.map(p=>p.id))+1,name:d.get('name'),area:d.get('area'),status:'Pending'});log(`${d.get('name')} added for pilot review.`);toast('Prospect added. Operations review is next.')}}if(f.classList.contains('collect')){let x=state.orders.find(x=>x.id===f.dataset.order);if(x?.status!=='Ready')return toast('Order must be ready before collection.');if(d.get('code')!==x.code)return toast('Code does not match. Ask the customer to check My orders.');x.status='Collected';x.consumed=true;log(`${x.id} collected. Customer code verified.`);toast('Collection confirmed. Settlement entry created.')}save();render()});
render();
</script></body></html>
